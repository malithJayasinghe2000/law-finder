    why: The Rent Act is not in the corpus.

  - id: nic-008
    label: not_in_corpus
    question: How do I register a trademark in Sri Lanka?
    why: The Intellectual Property Act is not in the corpus.

  - id: nic-009
    label: not_in_corpus
    question: What makes a last will formally valid in Sri Lanka — how many witnesses are required?
    why: >
      Same trap as nic-001. The Civil Procedure Code holds Chapter XXXVIII, Testamentary
      Actions — how a will is PROVED, who applies, in what time. It does not hold the
      Wills Ordinance, which is what says how a will must be executed and witnessed.
      Compare cpc-011 to cpc-013, which ask about the procedure and must be answered.

  - id: nic-010
    label: not_in_corpus
    question: What is the procedure for claiming maintenance in the Magistrate's Court under the Maintenance Act?
    why: >
      The Maintenance Act is not in the corpus. Worded deliberately to name it, because
      the CPC does hold maintenance and alimony ON DIVORCE (sections 614, 615), so the
      looser question "what about maintenance for children" is genuinely ambiguous rather
      than out of corpus.

  - id: nic-011
    label: not_in_corpus
    question: How does prescription operate over land in Sri Lanka?
    why: The Prescription Ordinance is not in the corpus.

  - id: nic-012
