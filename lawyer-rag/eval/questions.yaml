# The golden evaluation set — see eval/README.md
#
# EVERY expected section below was read in the vector store before the question was
# written. Do not derive an answer key from what the retriever returns: it would score
# 100% by construction and measure nothing.
#
# document names are the names AS STORED. Note that the Computer Crime Act is stored as
# "Act No. 24 of 2007" and the Social Security Contribution Levy (Amendment) Act as
# "Act No. 24 of 2025" — a real defect, recorded in docs/RAG-REVIEW.md §4.12, not a typo
# here. The evaluation has to address the corpus as it is.

