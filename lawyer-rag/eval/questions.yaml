  # ─────────────────────────────────────────────────────────────────────────
  # not_in_corpus — the honest answer is "I do not hold that legislation"
  #
  # Half the value of this file. These are the questions a real Sri Lankan user asks
  # within minutes of opening the assistant, and the corpus holds none of the answers.
  # ─────────────────────────────────────────────────────────────────────────
  - id: nic-001
    label: not_in_corpus
    question: What are the grounds for divorce in Sri Lanka?
    why: >
      The subtlest case in this file, and the most valuable. The Civil Procedure Code
      DOES hold matrimonial procedure — Chapter XLII, sections 595-626 — so retrieval
      will confidently return real, relevant-looking sections. But section 597 expressly
      defers the GROUNDS to "the law applicable in Sri Lanka to his or her case", and
      that law is not in the corpus. The grounds are therefore not held, even though the
      chapter about divorce is.

      At baseline the service answered this by listing "Adultery (Section 597 of the
      Civil Procedure Code), Cruelty (Section 597), Desertion" — attributing substantive
      grounds to a procedural section that explicitly declines to state them. Note that
      this answer PASSES the grounding check, because s.597 really was retrieved. It is
      the clearest demonstration that citation-matching is not faithfulness.

      Compare cpc-009 and cpc-010, which ask about the procedure and must be answered.

  - id: nic-002
    label: not_in_corpus
    question: How is ownership of land transferred in Sri Lanka?
    why: No land law in the corpus — no Registration of Documents Ordinance, no Partition Act.

  - id: nic-003
    label: not_in_corpus
    question: How much notice must an employer give before terminating an employee in Sri Lanka?
    why: No employment legislation — no Termination of Employment of Workmen Act, no Shop and Office Employees Act.

  - id: nic-004
