# The golden evaluation set — see eval/README.md
#
# EVERY expected section below was read in the vector store before the question was
# written. Do not derive an answer key from what the retriever returns: it would score
# 100% by construction and measure nothing.
#
# document names are the names AS STORED. Note that the Computer Crime Act is stored as
# "Act No. 24 of 2007" and the Social Security Contribution Levy (Amendment) Act as
# "Act No. 24 of 2025" — a real defect, recorded in docs/RAG-REVIEW.md §4.12, not a typo
# here. The evaluation has to address the corpus as it is.

meta:
  corpus:
    - Companies Act
    - Civil Procedure Code
    - Motor Traffic Act
    - Act No. 24 of 2007      # Computer Crime Act, No. 24 of 2007
    - Act No. 24 of 2025      # Social Security Contribution Levy (Amendment) Act, No. 24 of 2025
    # ── land, property and conveyancing, loaded 2026-09-20 (roadmap 4.1) ──
    - Penal Code
    - Partition Law
    - Prescription Ordinance
    - Prevention of Frauds Ordinance
    - Registration of Documents Ordinance
    - Notaries Ordinance
    - Powers of Attorney Ordinance
    - Land Development Ordinance
    - Land (Restrictions on Alienation) Act
  written: 2026-09-13
  written_against_chunks: 2368
  revised: 2026-09-20
  revised_against_chunks: 3860
  # WHAT THE 2026-09-20 REVISION DID, and why a relabel is not a fix.
  #
  # Nine Acts were ingested. Four questions written as not_in_corpus became
  # genuinely answerable and were relabelled: nic-002, nic-004, nic-009,
  # nic-011. Each now carries an expected section that was READ in the store,
  # not taken from what the retriever happens to return.
  #
  # TWO DID NOT, AND THAT IS THE FINDING. nic-008 (trademarks) and nic-016
  # (lease notice periods) are still not in the corpus and must still be
  # refused — but they now CLEAR the 0.62 relevance floor on land-registration
  # and foreign-lease chunks that have nothing to do with either question.
  # Growing the corpus put more near-neighbours within reach of the same
  # threshold, so the floor discriminates less well than it did at 2,368
  # chunks. Raising the floor is the wrong fix: nic-008 scores 0.656, and a
  # floor above it costs five genuinely answerable questions (see the sweep in
  # docs/RAG-REVIEW.md §4.24). The right fix is reranking — roadmap Stage 2.2.

