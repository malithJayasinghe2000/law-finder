  # RELABELLED 2026-09-20 — was not_in_corpus. The Penal Code is now held.
  #
  # ⚠️ THE SECTION NUMBER HERE WAS WRONG, AND THE WAY IT WAS WRONG MATTERS.
  # It was first written as s.368, read out of the vector store exactly as
  # eval/README.md requires. The store was wrong. The Penal Code is typeset with
  # the marginal note, the section number and the body as three separate blocks
  # on one line, and the old extractor returned them in an order that put "368."
  # in front of the theft-punishment sentence. Reading the PDF's block
  # coordinates settles it:
  #
  #     x0= 72.2  "Punishment for theft."      <- marginal note
  #     x0=167.3  "367."                       <- the section number
  #     x0=239.2  "Whoever commits theft shall be punished with imprisonment..."
  #
  # s.367 is punishment for theft; s.368 is theft of cattle. Until the
  # layout-aware extractor landed, this service cited s.368 for the punishment
  # for theft — a real, plausible, correctly-formatted citation to the wrong
  # section, which is the one class of error a reader cannot detect.
  #
  # The lesson for this file: "read it in the store first" is the right rule and
  # it is not sufficient. The store can be wrong, and a key derived from it
  # inherits the error and then certifies it.
  - id: nic-004
    label: answerable
    question: What is the punishment for theft under the Sri Lankan Penal Code?
    expect_document: Penal Code
    expect_sections: ["367"]
    expect_terms: [theft, three years, fine]

