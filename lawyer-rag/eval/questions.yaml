  # ── CPC: matrimonial and testamentary PROCEDURE, which the Code does hold ──
  #
  # These exist to test the sharpest line in this corpus. The Civil Procedure Code
  # holds Chapter XLII (Matrimonial Actions) and Chapter XXXVIII (Testamentary
  # Actions) — the PROCEDURE for these matters. It does not hold the substantive
  # law of divorce: the GROUNDS. Section 597 expressly defers those to "the law
  # applicable in Sri Lanka", which is not held.
  #
  # A system that refuses these is over-refusing. A system that answers nic-001 is
  # over-reaching. That pair is the test.
  #
  # ⚠️ UPDATED 2026-09-20. This block used to say the same of wills — procedure
  # held, substance absent — and cited nic-009 alongside nic-001. Half of that is
  # no longer true. The Prevention of Frauds Ordinance is now in the corpus and
  # its s.4 states the execution formalities for a will, so nic-009 has been
  # relabelled answerable. Only the divorce half of this pairing survives.
  #
  # The general lesson, which is why this note is left in: LOADING LEGISLATION
  # SILENTLY INVALIDATES ANSWER KEYS. A label that reads "not in the corpus" is a
  # claim about the corpus, and it expires the moment the corpus changes.

  - id: cpc-009
    label: answerable
    question: What is a decree nisi in a Sri Lankan action for dissolution of marriage?
    expect_document: Civil Procedure Code
    expect_sections: ["604"]
    expect_terms: [decree nisi, absolute]

