    why: >
      The Intellectual Property Act is not in the corpus. Verified again on
      2026-09-20 after the land-law ingest: a regex for "trade mark" across all
      nine new Acts returns ZERO chunks, so the honest answer is unchanged.

      ⚠️ BUT ITS BEHAVIOUR CHANGED, AND THIS IS NOW ONE OF THE MOST IMPORTANT
      QUESTIONS IN THIS FILE. It used to be declined by the relevance floor.
      It now scores 0.656 and CLEARS the 0.62 gate on six chunks about the land
      register, powers of attorney and foreign land transfer — not one of which
      concerns trademarks. The word "register" is doing all the work.

      This is RAG-REVIEW §4.10 returning by a new route: having sources is not
      the same as being sourced. Watch this question whenever the corpus grows.

  # RELABELLED 2026-09-20 — was not_in_corpus, and the reason it was written is
